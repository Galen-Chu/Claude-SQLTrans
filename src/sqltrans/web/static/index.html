<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLTrans — Translate · Ask · Run</title>
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/prism.css">
    <link rel="stylesheet" href="/static/css/prism-dark.css" disabled>
    <style>
        :root {
            --st-bg: #f7f7f8;
            --st-surface: #ffffff;
            --st-border: #d8d8df;
            --st-text: #1c1c22;
            --st-muted: #666673;
            --st-primary: #2563eb;
            --st-primary-hover: #1d4ed8;
            --st-ok: #15803d;
            --st-warn: #b45309;
            --st-err: #b91c1c;
        }
        html[data-theme="dark"] {
            --st-bg: #15151a;
            --st-surface: #1e1e25;
            --st-border: #33333d;
            --st-text: #e8e8ee;
            --st-muted: #9a9aa8;
            --st-primary: #6ea8fe;
            --st-primary-hover: #93c0ff;
            --st-ok: #4ade80;
            --st-warn: #fbbf24;
            --st-err: #f87171;
        }
        body { margin: 0; background: var(--st-bg); color: var(--st-text);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .app-container { max-width: 1100px; margin: 0 auto; padding: 16px; }

        header.header { display: flex; align-items: center; justify-content: space-between;
                        padding: 8px 4px 16px; }
        header h1 { font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .conn-badge { font-size: 0.8rem; color: var(--st-muted); }

        nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--st-border); margin-bottom: 16px; }
        nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent;
                          padding: 8px 14px; cursor: pointer; color: var(--st-muted); font-size: 0.95rem; }
        nav.tabs button.active { color: var(--st-text); border-bottom-color: var(--st-primary); }

        .view { display: none; }
        .view.active { display: block; }
        .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.78rem; color: var(--st-muted); }
        input[type=text], select, textarea {
            background: var(--st-surface); color: var(--st-text); border: 1px solid var(--st-border);
            border-radius: 6px; padding: 7px 9px; font-size: 0.9rem; font-family: inherit;
        }
        textarea { width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical;
                   font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
        .sql-in { width: 100%; box-sizing: border-box; min-height: 90px; resize: vertical;
                  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
                  background: var(--st-surface); color: var(--st-text); border: 1px solid var(--st-border);
                  border-radius: 6px; padding: 9px; }
        .btn { background: var(--st-primary); color: #fff; border: none; border-radius: 6px;
               padding: 8px 14px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: var(--st-primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.ghost { background: transparent; color: var(--st-text); border: 1px solid var(--st-border); }
        .btn-small { padding: 5px 10px; font-size: 0.82rem; }
        .muted { color: var(--st-muted); font-size: 0.82rem; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
        .badge.ok { background: rgba(21,128,61,.15); color: var(--st-ok); }
        .badge.warn { background: rgba(180,83,9,.15); color: var(--st-warn); }
        .badge.err { background: rgba(185,28,28,.15); color: var(--st-err); }

        pre.sql-out { background: var(--st-surface); border: 1px solid var(--st-border);
                      border-radius: 6px; padding: 12px; overflow: auto; margin: 8px 0; }
        code[class*="language-"], pre[class*="language-"] { background: none !important;
                      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.88rem; }
        .warnings { margin: 6px 0; }
        .warnings div { color: var(--st-warn); font-size: 0.82rem; }

        table.results { width: 100%; border-collapse: collapse; margin-top: 8px; }
        table.results th, table.results td { text-align: left; padding: 6px 9px;
                      border-bottom: 1px solid var(--st-border); font-size: 0.85rem; }
        table.results th { color: var(--st-muted); font-weight: 600; }
        .schema-tree { font-size: 0.85rem; line-height: 1.6; }
        .schema-tree .table-name { font-weight: 600; }
        .schema-tree .col { color: var(--st-muted); padding-left: 14px; font-family: ui-monospace, monospace; }

        .toast-container { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .toast { padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .toast.error { background: var(--st-err); }
        .toast.success { background: var(--st-ok); }
        .feedback-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
                SQLTrans
            </h1>
            <div class="header-controls">
                <span id="conn-badge" class="conn-badge">connections: —</span>
                <button id="theme-toggle-btn" class="btn ghost btn-small" title="Toggle theme (Ctrl+Shift+T)">Theme</button>
            </div>
        </header>

        <nav class="tabs" id="tabs">
            <button data-view="translate" class="active">Translate</button>
            <button data-view="ask">Ask</button>
            <button data-view="run">Run</button>
            <button data-view="schema">Schema</button>
        </nav>

        <!-- Translate -->
        <section id="view-translate" class="view active">
            <div class="field" style="margin-bottom:10px">
                <label for="translate-input">Source SQL</label>
                <textarea id="translate-input" class="sql-in" placeholder="SELECT NVL(x, 0) FROM t"></textarea>
            </div>
            <div class="row" style="margin-bottom:10px">
                <div class="field"><label for="translate-read">Read dialect</label>
                    <select id="translate-read"><option value="">auto</option></select></div>
                <div class="field"><label for="translate-write">Write dialect</label>
                    <select id="translate-write"><option value="">auto</option></select></div>
                <button id="translate-btn" class="btn">Transpile</button>
                <button id="translate-copy" class="btn ghost btn-small">Copy</button>
            </div>
            <pre class="sql-out"><code id="translate-output" class="language-sql">-- transpiled SQL appears here</code></pre>
        </section>

        <!-- Ask (NL→SQL) -->
        <section id="view-ask" class="view">
            <div class="field" style="margin-bottom:10px">
                <label for="ask-prompt">Describe the query in plain language</label>
                <textarea id="ask-prompt" placeholder="count active users grouped by plan"></textarea>
            </div>
            <div class="row" style="margin-bottom:10px">
                <div class="field"><label for="ask-dialect">Target dialect</label>
                    <select id="ask-dialect"><option value="">default</option></select></div>
                <div class="field"><label for="ask-conn">Connection (schema context)</label>
                    <select id="ask-conn"><option value="">none</option></select></div>
                <button id="ask-btn" class="btn">Generate SQL</button>
            </div>
            <div id="ask-status" class="muted" style="margin-bottom:4px"></div>
            <pre class="sql-out"><code id="ask-output" class="language-sql">-- generated SQL appears here</code></pre>
            <div id="ask-warnings" class="warnings"></div>
            <div id="ask-feedback" class="feedback-row" style="display:none">
                <span class="muted">Did this answer your question?</span>
                <button class="btn ghost btn-small" data-fb="yes">👍 Yes</button>
                <button class="btn ghost btn-small" data-fb="no">👎 No</button>
            </div>
        </section>

        <!-- Run -->
        <section id="view-run" class="view">
            <div class="row" style="margin-bottom:10px">
                <div class="field"><label for="run-conn">Connection</label>
                    <select id="run-conn"><option value="">select…</option></select></div>
                <div class="field"><label for="run-url">…or direct URL</label>
                    <input id="run-url" type="text" placeholder="sqlite:///./app.db"></div>
                <div class="field"><label for="run-limit">Row limit</label>
                    <input id="run-limit" type="text" value="1000" style="width:90px"></div>
            </div>
            <div class="field" style="margin-bottom:10px">
                <label for="run-sql">SQL (read-only SELECT)</label>
                <textarea id="run-sql" class="sql-in" placeholder="SELECT * FROM users LIMIT 10"></textarea>
            </div>
            <button id="run-btn" class="btn" style="margin-bottom:10px">Run</button>
            <div id="run-meta" class="muted"></div>
            <div id="run-results" style="overflow:auto"></div>
        </section>

        <!-- Schema -->
        <section id="view-schema" class="view">
            <div class="row" style="margin-bottom:10px">
                <div class="field"><label for="schema-conn">Connection</label>
                    <select id="schema-conn"><option value="">select…</option></select></div>
                <div class="field"><label for="schema-url">…or direct URL</label>
                    <input id="schema-url" type="text" placeholder="sqlite:///./app.db"></div>
                <div class="field"><label for="schema-name">Schema</label>
                    <input id="schema-name" type="text" placeholder="public" style="width:120px"></div>
                <button id="schema-btn" class="btn">Load</button>
            </div>
            <div id="schema-tree" class="schema-tree"></div>
        </section>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/lib/prism.min.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/keyboard.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
